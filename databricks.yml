
bundle:
  name: ecommerce_lakehouse

variables:
  catalog:
    default: lakehouse_dev
  schema:
    default: bronze

resources:
  pipelines:
    olist_lakehouse_pipeline:
      name: olist_lakehouse
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: ./pipelines/olist_lakehouse
      libraries:
        - glob:
            include: ./pipelines/olist_lakehouse/transformations/**

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: lakehouse_dev
      schema: bronze

  prod:
    mode: production
    git:
      branch: main
    variables:
      catalog: lakehouse
      schema: bronze
