bundle:
  name: ecommerce_lakehouse

variables:
  catalog:
    default: lakehouse_dev
  schema:
    default: bronze

resources:
  pipelines:
    olist_lakehouse_pipeline:
      name: olist_lakehouse
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      # Prod uses relative paths -> resolves to the deployed .bundle snapshot
      root_path: ./pipelines/olist_lakehouse
      libraries:
        - glob:
            include: ./pipelines/olist_lakehouse/transformations/**

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: lakehouse_dev
      schema: bronze
    resources:
      pipelines:
        olist_lakehouse_pipeline:
          # Dev uses your live Git folder directly (resolves to /Workspace/Users/dutkabar@gmail.com/...)
          root_path: /Workspace/Users/${workspace.current_user.userName}/ecommerce-lakehouse/pipelines/olist_lakehouse
          libraries:
            - glob:
                include: /Workspace/Users/${workspace.current_user.userName}/ecommerce-lakehouse/pipelines/olist_lakehouse/transformations/**

  prod:
    mode: production
    git:
      branch: main
    variables:
      catalog: lakehouse
      schema: bronze
